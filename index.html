<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071d49"><title>SimulaSebrae BA</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#061637,#0d5fc7 55%,#20b7ef);min-height:100vh;color:#14213d}header{color:#fff;padding:34px 20px 28px;max-width:760px;margin:auto}header .tag{font-size:12px;letter-spacing:1.8px;opacity:.8;font-weight:700}h1{font-size:32px;margin:9px 0 5px}header p{margin:0;opacity:.85}.wrap{max-width:760px;margin:auto;padding:0 14px 34px}.card{background:rgba(255,255,255,.97);border-radius:24px;padding:22px;margin:14px 0;box-shadow:0 16px 35px #00133755}.label{font-size:13px;font-weight:700;color:#49617d;margin-bottom:8px}select,button{width:100%;font:inherit;border-radius:14px;padding:14px;border:0}select{background:#f1f6ff;border:1px solid #cfe0f8;color:#14213d;margin-bottom:10px}button{background:linear-gradient(100deg,#0875e1,#12b6ef);color:#fff;font-weight:700;box-shadow:0 7px 16px #0875e144;margin-top:8px;cursor:pointer}.secondary{background:#eaf3ff;color:#1165b5;box-shadow:none}.progress{height:8px;background:#e7eef8;border-radius:8px;overflow:hidden;margin:12px 0 20px}.bar{height:100%;background:linear-gradient(90deg,#086ee0,#1dc9ee);transition:.3s}.question{font-size:19px;line-height:1.4}.option{text-align:left;background:#f1f6fc;color:#172542;box-shadow:none;border:1px solid #d9e7f7;margin-top:10px}.option:hover{border-color:#168be8}.correct{background:#d9f8e7!important;border-color:#3cc47c!important}.wrong{background:#ffe1e5!important;border-color:#ed6c7c!important}.hidden{display:none}.muted{color:#60718a;font-size:14px;line-height:1.5}.score{font-size:42px;color:#086ee0;font-weight:800;margin:5px 0}.review{border-top:1px solid #e4ebf4;padding:14px 0;line-height:1.45}.badge{display:inline-block;background:#e9f4ff;color:#086ee0;border-radius:20px;padding:7px 11px;font-size:13px;font-weight:700}</style></head><body><header><div class="tag">PREPARE-SE COM FOCO</div><h1>SimulaSebrae BA</h1><p>Simulados práticos para sua preparação</p></header><main class="wrap"><section id="home" class="card"><div class="label">ESCOLHA O CARGO</div><select id="cargo"><option value="negocios">Analista Técnico I · Negócios</option><option value="projetos">Analista Técnico I · Projetos</option><option value="sistemas">Analista Técnico II · Sistemas</option><option value="assistente">Assistente · Administrativo</option></select><p class="muted">Questões autorais inspiradas nos temas e no nível de seleções anteriores do SEBRAE-BA.</p><button onclick="start()">Começar simulado</button></section><section id="quiz" class="card hidden"></section><section id="result" class="card hidden"></section></main><script>const banco={negocios:[['Em um diagnóstico empresarial, a primeira conduta mais adequada é:',['Oferecer imediatamente um produto padrão','Compreender o contexto, as necessidades e os objetivos do cliente','Registrar apenas o faturamento','Encaminhar o cliente sem análise'],1,'O diagnóstico deve começar pela compreensão do contexto e da necessidade.'],['Um bom indicador de acompanhamento deve ser:',['Genérico e sem periodicidade','Mensurável, relacionado ao objetivo e acompanhado ao longo do tempo','Definido somente no encerramento','Baseado em opinião isolada'],1,'Indicadores apoiam o acompanhamento e a tomada de decisão.']],projetos:[['Em gestão de projetos, o monitoramento serve principalmente para:',['Substituir o planejamento','Comparar a execução com os objetivos e corrigir desvios','Eliminar todos os riscos','Evitar registros'],1,'Monitorar permite identificar desvios e tomar ações corretivas.'],['Uma parceria institucional bem estruturada deve definir:',['Somente o nome dos parceiros','Objetivos, responsabilidades, recursos, prazos e acompanhamento','Apenas divulgação','Nenhum indicador'],1,'A definição clara reduz riscos de execução.']],sistemas:[['Um requisito não funcional descreve:',['Uma regra de negócio específica','Uma característica de qualidade, como segurança ou desempenho','O nome do usuário','Uma consulta SQL obrigatória'],1,'Segurança e desempenho são atributos não funcionais.'],['Em testes de aceitação, verifica-se principalmente se:',['O código está formatado','A solução atende às necessidades e aos critérios do negócio','O servidor foi comprado','A equipe fez treinamento'],1,'O foco é verificar a aderência ao que o negócio precisa.']],assistente:[['Ao organizar documentos de um processo, é boa prática:',['Misturar versões','Usar identificação, ordenação e controle de acesso adequados','Excluir registros antigos sem regra','Guardar tudo sem classificação'],1,'Organização e rastreabilidade apoiam o trabalho administrativo.'],['Ao receber uma demanda urgente, deve-se primeiro:',['Executar sem entender','Confirmar escopo, prazo, prioridade e responsável','Ignorar o solicitante','Alterar o sistema sem registro'],1,'Confirmar a demanda evita retrabalho e falhas.']]};let data=[],pos=0,respostas=[];function start(){data=banco[document.getElementById('cargo').value];pos=0;respostas=[];document.getElementById('home').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render()}function render(){let q=data[pos];document.getElementById('quiz').innerHTML=`<span class="badge">Questão ${pos+1} de ${data.length}</span><div class="progress"><div class="bar" style="width:${(pos/data.length)*100}%"></div></div><div class="question">${q[0]}</div>`+q[1].map((a,n)=>`<button class="option" onclick="answer(${n})">${String.fromCharCode(65+n)}) ${a}</button>`).join('')}function answer(n){respostas[pos]=n;pos++;if(pos<data.length)render();else finish()}function finish(){let pontos=respostas.reduce((s,a,i)=>s+(a===data[i][2]?1:0),0);let pct=Math.round(pontos/data.length*100);let r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML=`<span class="badge">RESULTADO FINAL</span><div class="score">${pontos}/${data.length}</div><p class="muted">Você acertou ${pct}% das questões.</p>`+data.map((q,i)=>`<div class="review"><b>${i+1}. ${respostas[i]===q[2]?'✅ Resposta correta':'❌ Resposta incorreta'}</b><br>Resposta certa: <b>${String.fromCharCode(65+q[2])}) ${q[1][q[2]]}</b><br><span class="muted">${q[3]}</span></div>`).join('')+'<button onclick="back()">Voltar ao início</button><button class="secondary" onclick="start()">Refazer simulado</button>'}function back(){document.getElementById('result').classList.add('hidden');document.getElementById('home').classList.remove('hidden')}</script></body></html>
