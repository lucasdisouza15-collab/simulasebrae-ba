<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aprova+</title><style>body{margin:0;background:#f4faff;color:#12304d;font-family:Arial,sans-serif}.app{max-width:760px;margin:auto}.hero{background:linear-gradient(135deg,#087ed1,#15c0ed);color:#fff;padding:28px 20px;border-radius:0 0 28px 28px}.brand{font-size:26px;font-weight:800}.hero h1{font-size:28px;margin:28px 0 6px}.main{padding:16px}.card{background:white;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #07528b18}h2{margin-top:0}.muted{font-size:14px;color:#678096}select,textarea,button{width:100%;padding:14px;border-radius:12px;font-size:16px;font-family:inherit}select,textarea{border:1px solid #cfe2ef;background:#f9fcff}button{border:0;background:#078fd8;color:#fff;font-weight:bold;margin-top:10px;cursor:pointer}.hidden{display:none}.q{font-size:20px;line-height:1.4;margin:20px 0}.choice{background:#f4faff;color:#12304d;border:1px solid #cfe2ef;text-align:left}.bar{height:8px;background:#0aa8df;border-radius:8px;margin:14px 0}.score{font-size:44px;font-weight:bold;color:#078fd8}.comment{border-bottom:1px solid #e4edf3;padding:12px 0}.fun{color:#60788d;font-style:italic}</style></head><body><div class="app"><header class="hero"><div class="brand">Aprova+</div><h1>Estude com método.</h1><p>Questões por cargo e treino de redação.</p></header><main class="main"><section id="home" class="card"><h2>Escolha seu cargo</h2><p class="muted">Simulado autoral de treinamento.</p><select id="cargo"><option value="negocios">Analista Técnico I — Negócios</option><option value="projetos">Analista Técnico I — Projetos e Processos</option><option value="pessoas">Analista Técnico I — Gestão de Pessoas</option><option value="sistemas">Analista Técnico II — Sistemas</option></select><button id="start">Começar simulado</button></section><section id="quiz" class="card hidden"></section><section id="result" class="card hidden"></section><section class="card"><h2>Treino de redação</h2><button id="topicButton">Gerar tema</button><p id="topic" class="q"></p><textarea id="essay" rows="9" placeholder="Escreva sua redação aqui..."></textarea><button id="grade">Analisar redação</button><p id="feedback" class="muted"></p></section></main></div><script>(function(){'use strict';var bank={negocios:[['Antes de recomendar uma solução, o profissional deve:',['diagnosticar a necessidade','escolher o produto mais caro','usar a mesma resposta para todos','ignorar restrições'],0,'Diagnóstico conecta solução e necessidade.'],['Pergunta aberta ajuda a:',['ampliar a compreensão','encerrar conversa','evitar escuta','forçar resposta'],0,'Perguntas abertas revelam contexto.']],projetos:[['Indicador de projeto útil é aquele que:',['se relaciona ao objetivo','não tem periodicidade','mede apenas opinião','é criado no final'],0,'Indicadores apoiam o acompanhamento.'],['Risco relevante deve ser:',['registrado e tratado','ocultado','ignorado','transferido sem análise'],0,'Registro permite resposta adequada.']],pessoas:[['Processo seletivo consistente usa:',['critérios claros','preferência pessoal','critérios variáveis','nenhuma evidência'],0,'Critérios claros favorecem isonomia.'],['Treinamento deve ter:',['objetivo e avaliação','só presença','nenhum indicador','conteúdo aleatório'],0,'Avaliação mostra resultado.']],sistemas:[['Requisito não funcional trata de:',['segurança ou desempenho','nome do usuário','regra de negócio','cor do botão'],0,'É um atributo de qualidade.'],['Teste de aceitação verifica:',['atendimento às necessidades do negócio','formatação','compra do servidor','envio de e-mail'],0,'O foco é o negócio.']]};var topics=['Inovação nos pequenos negócios','Transformação digital e inclusão produtiva','ESG e sustentabilidade empresarial','Educação empreendedora','Uso ético de dados e inteligência artificial'];var data=[],index=0,answers=[];function byId(x){return document.getElementById(x)}function startQuiz(){data=bank[byId('cargo').value];index=0;answers=[];byId('home').className='card hidden';byId('result').className='card hidden';byId('quiz').className='card';showQuestion()}function showQuestion(){var q=data[index],html='<div class="muted">Questão '+(index+1)+' de '+data.length+'</div><div class="bar"></div><div class="q">'+q[0]+'</div>';for(var n=0;n<q[1].length;n++){html+='<button class="choice" data-n="'+n+'">'+String.fromCharCode(65+n)+') '+q[1][n]+'</button>'}byId('quiz').innerHTML=html;var buttons=byId('quiz').querySelectorAll('[data-n]');for(var j=0;j<buttons.length;j++){buttons[j].addEventListener('click',function(){answer(Number(this.getAttribute('data-n')))} )}}function answer(n){answers[index]=n;index++;if(index<data.length){showQuestion()}else{finish()}}function finish(){var score=0;for(var j=0;j<data.length;j++){if(answers[j]===data[j][2])score++}var text=score===data.length?'Gabaritou! Seu cérebro está de parabéns.':score?'Boa base! Revise os comentários.':'Foi aquecimento: até o Wi-Fi cai antes de conectar.';var html='<div class="muted">GABARITO COMENTADO</div><div class="score">'+score+'/'+data.length+'</div><p class="fun">'+text+'</p>';for(var k=0;k<data.length;k++){var q=data[k];html+='<div class="comment"><b>'+(answers[k]===q[2]?'✅ Acertou':'❌ Revise')+'</b><br>Resposta: '+String.fromCharCode(65+q[2])+') '+q[1][q[2]]+'<br><span class="muted">'+q[3]+'</span></div>'}html+='<button id="again">Refazer</button><button id="back">Escolher outro cargo</button>';byId('quiz').className='card hidden';byId('result').className='card';byId('result').innerHTML=html;byId('again').addEventListener('click',startQuiz);byId('back').addEventListener('click',function(){byId('result').className='card hidden';byId('home').className='card'})}function newTopic(){byId('topic').textContent=topics[Math.floor(Math.random()*topics.length)]}function grade(){var text=byId('essay').value.trim();if(!text){byId('feedback').textContent='Escreva um texto antes da análise.';return}var words=text.split(/\s+/).length;byId('feedback').innerHTML='<b>Análise orientativa:</b> '+words+' palavras. Revise tese, argumentos, conclusão, coesão, pontuação e concordância. A avaliação automática é apenas para treino.'}byId('start').addEventListener('click',startQuiz);byId('topicButton').addEventListener('click',newTopic);byId('grade').addEventListener('click',grade)})();</script></body></html>
