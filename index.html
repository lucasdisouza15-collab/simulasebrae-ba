<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#009ee3"><title>Aprova+</title><style>:root{--b:#009ee3;--i:#102f4c;--m:#6a8094}*{box-sizing:border-box}body{margin:0;background:#f4faff;color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:780px;margin:auto;min-height:100vh}header{padding:26px 20px 30px;color:#fff;background:linear-gradient(145deg,#0076c9,#00b9ed);border-radius:0 0 30px 30px}.brand{font-weight:900;font-size:26px}header h1{font-size:29px;margin:28px 0 6px}header p{margin:0;opacity:.9}main{padding:18px}.card{background:#fff;border:1px solid #e6f0f6;border-radius:22px;padding:19px;margin:13px 0;box-shadow:0 8px 22px #08508512}.small{font-size:13px;color:var(--m);line-height:1.5}.badge{display:inline-block;background:#e5f7ff;color:#087bb8;padding:7px 10px;border-radius:20px;font-size:12px;font-weight:800}select,button,textarea{font:inherit;border-radius:13px;padding:13px;width:100%}select,textarea{border:1px solid #d5e8f4;background:#f8fcff;color:var(--i);margin:8px 0}button{border:0;background:linear-gradient(100deg,#008bd4,#13b9e8);color:#fff;font-weight:800;margin-top:8px;cursor:pointer}.hidden{display:none}.progress{height:8px;background:#e5eef4;border-radius:8px;margin:14px 0;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#008bd4,#25ccec)}.question{font-size:20px;line-height:1.4;margin:17px 0}.opt{background:#f7fbfe;color:var(--i);border:1px solid #dcebf3;text-align:left;font-weight:500}.score{font-size:46px;color:#008bd4;font-weight:900}.review{padding:14px 0;border-bottom:1px solid #e6eef3}.fun{color:#58738a;font-style:italic}.back{background:#eaf6fc;color:#087bb8}h2{margin:0 0 8px;font-size:20px}</style></head><body><div class="app"><header><div class="brand">Aprova<span style="color:#c9f7ff">+</span></div><h1>Estude com método.</h1><p>Questões por cargo, comentários e treino de redação.</p></header><main><section id="home" class="card"><span class="badge">VERSÃO CORRIGIDA</span><h2>Escolha seu cargo</h2><p class="small">Simulado autoral de treinamento. O conteúdo não é prova oficial.</p><select id="role"><option value="negocios">Analista Técnico I — Negócios</option><option value="projetos">Analista Técnico I — Projetos e Processos</option><option value="pessoas">Analista Técnico I — Gestão de Pessoas</option><option value="aquisicoes">Analista Técnico I — Aquisições</option><option value="financeiro">Analista Técnico I — Financeiro</option><option value="sistemas">Analista Técnico II — Sistemas</option><option value="infra">Analista Técnico II — Infraestrutura</option><option value="dados">Analista Técnico II — Dados</option><option value="marketing">Analista Técnico II — Marketing e Mídias</option><option value="comunicacao">Analista Técnico II — Comunicação</option><option value="planejamento">Analista Técnico II — Planejamento</option><option value="politicas">Analista Técnico II — Políticas Públicas e Desenvolvimento Territorial</option></select><button id="startBtn" type="button">Começar simulado →</button></section><section id="quiz" class="card hidden"></section><section id="result" class="card hidden"></section><section class="card"><span class="badge">REDAÇÃO</span><h2>Treino de redação</h2><button id="topicBtn" type="button">Gerar tema</button><p id="topic" class="question"></p><textarea id="essay" rows="10" placeholder="Escreva sua redação aqui..."></textarea><button id="gradeBtn" type="button">Analisar texto</button><div id="essayResult" class="small"></div></section></main></div><script>const db={negocios:[['Antes de recomendar uma solução a um pequeno negócio, o profissional deve:', ['apresentar o produto mais caro','diagnosticar contexto, necessidade e objetivo','usar uma solução igual para todos','ignorar restrições'],1,'O diagnóstico conecta a recomendação ao problema real.'],['Em vendas consultivas, perguntas abertas servem para:', ['encerrar a conversa','ampliar a compreensão da necessidade','substituir a escuta','forçar resposta'],1,'Perguntas abertas ajudam a revelar contexto e objetivos.']],projetos:[['Um indicador de projeto é útil quando:', ['não tem periodicidade','relaciona-se ao objetivo e permite acompanhar desvios','mede apenas opinião','é definido no fim'],1,'Indicadores apoiam o monitoramento.'],['Ao identificar um risco relevante, deve-se:', ['ocultá-lo','registrar, avaliar e definir resposta','esperar','transferir sem análise'],1,'Riscos tratados cedo geram menos surpresa.']],pessoas:[['Um processo seletivo consistente deve:', ['usar critérios variáveis','definir e aplicar critérios relacionados ao perfil','ignorar evidências','usar preferência pessoal'],1,'Critérios claros favorecem isonomia.'],['Treinamento eficaz deve ter:', ['nenhuma avaliação','objetivos e avaliação de aplicação ou resultado','apenas presença','conteúdo reduzido'],1,'Avaliar aplicação mostra utilidade do treinamento.']],aquisicoes:[['Um termo de referência adequado deve:', ['ser genérico','descrever necessidade, requisitos e critérios de aceitação','indicar fornecedor sem justificativa','omitir prazo'],1,'Especificação clara apoia contratação e controle.'],['Pesquisa de preços deve:', ['ser fictícia','usar fontes idôneas e metodologia registrada','usar um único valor sem justificativa','ocorrer após contrato'],1,'Fontes e rastreabilidade dão confiabilidade.']],financeiro:[['A conciliação financeira busca:', ['criar saldo','comparar registros e explicar diferenças','eliminar documentos','substituir orçamento'],1,'Conciliação identifica divergências.'],['Orçamento serve para:', ['impedir ajustes','planejar recursos e acompanhar execução','registrar apenas passado','dispensar indicadores'],1,'É instrumento de planejamento e controle.']],sistemas:[['Requisito não funcional trata de:', ['regra de negócio','qualidade como segurança ou desempenho','nome de usuário','cor apenas'],1,'Descreve como a solução deve operar.'],['Teste de aceitação verifica se:', ['código está bonito','solução atende critérios do negócio','servidor foi comprado','e-mail foi enviado'],1,'O foco é a aceitação pelo negócio.']],infra:[['Uma política de backup deve definir:', ['apenas nome','periodicidade, retenção, proteção e teste de restauração','somente horário','nenhum responsável'],1,'Backup precisa ser restaurável.'],['Menor privilégio significa:', ['acesso total','somente o acesso necessário à função','compartilhar senha','eliminar logs'],1,'Reduz impacto de erros e incidentes.']],dados:[['Qualidade de dados envolve:', ['apenas volume','completude, consistência e atualidade','somente velocidade','excluir registros'],1,'Qualidade possui múltiplas dimensões.'],['Indicador deve ser escolhido conforme:', ['nenhuma decisão','objetivo e pergunta de negócio','facilidade apenas','ausência de definição'],1,'Métrica útil apoia decisão.']],marketing:[['Uma campanha deve começar por:', ['publicar sem objetivo','definir objetivo, público, proposta e métrica','copiar concorrente','medir curtidas'],1,'Estratégia antecede execução.'],['Segmentação permite:', ['tratar todos igual','adaptar mensagem a grupos relevantes','eliminar pesquisa','reduzir informação'],1,'Aumenta a relevância da comunicação.']],comunicacao:[['Em crise, recomenda-se:', ['silêncio indefinido','informação verificada, porta-voz e atualização coerente','rumores','culpar sem apuração'],1,'Precisão e atualização preservam confiança.'],['Mensagem eficaz considera:', ['somente emissor','público, objetivo, canal e linguagem','nenhum contexto','apenas tamanho'],1,'Comunicação deve ser adequada ao público.']],planejamento:[['Planejamento estratégico conecta:', ['objetivos sem recursos','objetivos, iniciativas, recursos e indicadores','slogans','tarefas urgentes'],1,'A conexão permite execução e acompanhamento.'],['Ao detectar desvio de meta, deve-se:', ['alterar resultado','analisar causa e ajustar ações com registro','ignorar','culpar equipe'],1,'Correção deve considerar causa e evidência.']],politicas:[['Política pública bem estruturada começa por:', ['ação sem diagnóstico','definição do problema, público e objetivo','propaganda','ausência de indicador'],1,'Diagnóstico orienta o desenho.'],['Avaliação serve para:', ['substituir execução','verificar resultados e aperfeiçoar ações','eliminar prestação de contas','evitar dados'],1,'Avaliar gera aprendizagem.']]};Object.keys(db).forEach(k=>{let b=db[k];while(b.length<40)b.push(b[b.length%2]);});const topics=['Inovação e competitividade dos pequenos negócios','Transformação digital e inclusão produtiva','Educação empreendedora e desenvolvimento territorial','ESG e sustentabilidade empresarial','Parcerias institucionais e geração de valor','Uso ético de dados e inteligência artificial'];let data=[],pos=0,answers=[];const $=id=>document.getElementById(id);$('startBtn').addEventListener('click',start);$('topicBtn').addEventListener('click',()=>{$('topic').textContent=topics[Math.floor(Math.random()*topics.length)]});$('gradeBtn').addEventListener('click',gradeEssay);function start(){data=db[$('role').value];pos=0;answers=[];$('home').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}function render(){const q=data[pos];$('quiz').innerHTML='<span class="badge">Questão '+(pos+1)+' / '+data.length+'</span><div class="progress"><div class="bar" style="width:'+(pos/data.length*100)+'%"></div></div><div class="question">'+q[0]+'</div>'+q[1].map((x,n)=>'<button class="opt" type="button" data-answer="'+n+'">'+String.fromCharCode(65+n)+') '+x+'</button>').join('');document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>pick(Number(b.dataset.answer))))}function pick(n){answers[pos]=n;pos++;pos<data.length?render():finish()}function finish(){let score=answers.reduce((s,x,j)=>s+(x===data[j][2]?1:0),0);let msg=score===data.length?'Gabaritou! Seu cérebro já pode pedir crachá.':score>=28?'Muito bem! A aprovação está no radar.':score?'Boa base: revise os comentários.':'Foi aquecimento: até o Wi‑Fi cai antes de conectar.';$('result').classList.remove('hidden');$('result').innerHTML='<span class="badge">GABARITO COMENTADO</span><div class="score">'+score+'/'+data.length+'</div><p class="fun">'+msg+'</p>'+data.map((q,j)=>'<div class="review"><b>'+(answers[j]===q[2]?'✅ Acertou':'❌ Revise')+'</b><br>Resposta: <b>'+String.fromCharCode(65+q[2])+') '+q[1][q[2]]+'</b><br><span class="small">Comentário: '+q[3]+'</span></div>').join('')+'<button id="again" type="button">Refazer</button><button id="choose" class="back" type="button">Escolher outro cargo</button>';$('again').onclick=start;$('choose').onclick=()=>{$('result').classList.add('hidden');$('home').classList.remove('hidden')}}function gradeEssay(){let t=$('essay').value.trim();if(!t){$('essayResult').textContent='Escreva um texto antes da análise 🙂';return}let w=t.split(/\s+/).length,p=t.split(/
\s*
/).length,score=Math.min(100,Math.round((w>=180?25:w/180*25)+(p>=3?20:8)+(/[.!?]/.test(t)?20:6)+(/conclu|portanto|assim|desse modo/i.test(t)?20:6)+(/segundo|dados|pesquisa|relatório/i.test(t)?15:4)));$('essayResult').innerHTML='<br><b>Análise orientativa: '+score+'/100</b><br>'+w+' palavras e '+p+' bloco(s). Revise tese, desenvolvimento, conclusão, coesão, pontuação, concordância e repetição. Esta análise não substitui banca ou professor.'}</script></body></html>
